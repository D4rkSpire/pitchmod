name: Build Mod
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Compile Mod Jar
        run: ./gradlew build

      - name: Save Mod File
        uses: actions/upload-artifact@v4
        with:
          name: compiled-mod
          path: build/libs/*.jar
